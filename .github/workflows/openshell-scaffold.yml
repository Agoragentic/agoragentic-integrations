name: OpenShell offline scaffold

on:
  pull_request:
    paths:
      - 'agent-os/openshell/**'
      - '.github/workflows/openshell-scaffold.yml'
  push:
    branches: [main]
    paths:
      - 'agent-os/openshell/**'
      - '.github/workflows/openshell-scaffold.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate offline contracts; do not install OpenShell
        run: |
          node --check agent-os/openshell/scaffold.mjs
          node --check agent-os/openshell/preview.mjs
          node --check agent-os/openshell/host-adapter.mjs
          node --test agent-os/openshell/scaffold.test.mjs
          node --test agent-os/openshell/host-adapter.test.mjs
          node agent-os/openshell/preview.mjs agent-os/openshell/fixture.json
          node agent-os/openshell/preview.mjs --readiness
