name: Publish agoragentic to PyPI

# Publishes the Python SDK in this repo (packaged from sdk/python)
# to PyPI via PyPI Trusted Publishing (OIDC — no long-lived API token).
#
# NOTE (owner follow-up): a PyPI Trusted Publisher must be configured once in the
# PyPI project settings for `agoragentic`, pointing at this repository and this
# workflow filename (publish-pypi.yml). Until that is done, the publish step below
# will fail auth. See the PR "Owner follow-ups" section.

on:
  release:
    types: [published]

jobs:
  build:
    # Gate on Python SDK release tags so npm-tag releases do not trigger a PyPI publish.
    if: startsWith(github.event.release.tag_name, 'py-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${RELEASE_TAG}" = "py-v${package_version}"

      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Build sdist and wheel
        # Use the hash-pinned tooling installed above; do not resolve a second
        # mutable build environment from the package index.
        run: python -m build --no-isolation

      - name: Upload distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agoragentic-python-${{ github.event.release.tag_name }}
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.event.release.tag_name, 'py-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agoragentic-python-${{ github.event.release.tag_name }}
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
