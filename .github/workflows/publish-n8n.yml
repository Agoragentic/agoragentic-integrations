name: Publish Agoragentic n8n Node to npm

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Verify release build runtime
        run: |
          node --version
          npm --version

      - name: Verify exact release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="n8n-v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Expected release tag ${expected}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and build n8n node
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Reject high or critical toolchain advisories
        run: npm run audit:dev

      - name: Pack the verified artifact
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --ignore-scripts)"
          test -f "${tarball}"
          printf 'tarball=%s\n' "${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agoragentic-n8n-${{ github.event.release.tag_name }}
          path: n8n/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.event.release.tag_name, 'n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download the exact package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agoragentic-n8n-${{ github.event.release.tag_name }}
          path: package/

      - name: Publish n8n node with npm trusted publishing
        shell: bash
        run: |
          test "$(find package -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          npm publish package/*.tgz --access public --ignore-scripts
