name: Transaction Assurance Conformance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'transaction-assurance/**'
      - '.github/workflows/transaction-assurance-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'transaction-assurance/**'
      - '.github/workflows/transaction-assurance-conformance.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      suite-ref:
        description: Immutable agoragentic-integrations commit containing the suite
        required: true
        type: string
      target-module:
        description: Caller-repository path exporting evaluateTransactionAssuranceVector
        required: true
        type: string
      target-name:
        required: true
        type: string
      target-version:
        required: true
        type: string
      target-commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  suite:
    if: inputs.suite-ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    defaults:
      run:
        working-directory: transaction-assurance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: transaction-assurance/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run conformance
      - run: npm run pack:dry

  external-target:
    # Reusable workflows retain the caller's event name. This input is only
    # declared on workflow_call, so direct suite runs skip the caller job.
    if: inputs.suite-ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable checkout inputs
        env:
          SUITE_REF: ${{ inputs.suite-ref }}
          TARGET_COMMIT: ${{ inputs.target-commit }}
        run: |
          if ! [[ "$SUITE_REF" =~ ^[0-9a-f]{40}$ && "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'suite-ref and target-commit must be full lowercase commit SHAs' >&2
            exit 1
          fi
      - name: Check out caller target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          ref: ${{ inputs.target-commit }}
          persist-credentials: false
      - name: Check out pinned suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Agoragentic/agoragentic-integrations
          ref: ${{ inputs.suite-ref }}
          path: suite
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: suite/transaction-assurance/package-lock.json
      - name: Verify checked-out commits and target path
        env:
          SUITE_REF: ${{ inputs.suite-ref }}
          TARGET_COMMIT: ${{ inputs.target-commit }}
          TARGET_MODULE: ${{ inputs.target-module }}
        run: |
          test "$(git -C suite rev-parse HEAD)" = "$SUITE_REF"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const modulePath = process.env.TARGET_MODULE;
          if (!modulePath || path.isAbsolute(modulePath)) {
            throw new Error('target-module must be a relative caller-repository path');
          }
          const root = fs.realpathSync('target');
          const target = fs.realpathSync(path.resolve(root, modulePath));
          if (!target.startsWith(root + path.sep) || !fs.statSync(target).isFile()) {
            throw new Error('target-module must resolve to a file inside the caller checkout');
          }
          NODE
      - name: Install locked suite dependencies
        working-directory: suite/transaction-assurance
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run target conformance
        env:
          TARGET_MODULE: ${{ inputs.target-module }}
          TARGET_NAME: ${{ inputs.target-name }}
          TARGET_VERSION: ${{ inputs.target-version }}
          TARGET_COMMIT: ${{ inputs.target-commit }}
        run: |
          node suite/transaction-assurance/bin/run-conformance.mjs \
            --target-module "$GITHUB_WORKSPACE/target/$TARGET_MODULE" \
            --target-name "$TARGET_NAME" \
            --target-version "$TARGET_VERSION" \
            --target-commit "$TARGET_COMMIT" \
            --json artifacts/report.json \
            --junit artifacts/junit.xml \
            --receipt artifacts/receipt.json
          node suite/transaction-assurance/bin/verify-conformance-receipt.mjs \
            artifacts/report.json artifacts/receipt.json
      - name: Upload bounded conformance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transaction-assurance-conformance
          path: artifacts/
          if-no-files-found: error
